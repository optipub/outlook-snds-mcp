name: Build and Release MCPB

# Builds the .mcpb bundle and attaches it to a GitHub Release whenever you
# push a version tag like v1.0.0 (or publish a release manually).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate manifest
        run: npx --yes @anthropic-ai/mcpb validate manifest.json

      - name: Pack bundle
        run: npx --yes @anthropic-ai/mcpb pack . outlook-snds.mcpb

      - name: Show bundle info
        run: npx --yes @anthropic-ai/mcpb info outlook-snds.mcpb

      - name: Upload bundle as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: outlook-snds-mcpb
          path: outlook-snds.mcpb

      - name: Attach bundle to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: outlook-snds.mcpb
          generate_release_notes: true
